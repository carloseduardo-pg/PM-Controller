<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" id="meta-theme-color" />
  <meta name="description" content="Entrar — DAILY" />
  <title>Entrar · DAILY</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("po_theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          var m = document.getElementById("meta-theme-color");
          if (m) m.setAttribute("content", "#0f0f0f");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/imagens/logo_daily.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --daily-blue: #2563eb;
      --daily-green: #22c55e;
      --heading-navy: #111827;
      --bg-page: #fafafa;
      --bg-card: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);
      --text: #1a1a1a;
      --text-muted: rgba(26, 26, 26, 0.62);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --secondary: #22c55e;
      --secondary-soft: rgba(34, 197, 94, 0.16);
      --radius-lg: 18px;
      --radius-md: 12px;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "Roboto Slab", Georgia, "Times New Roman", serif;
      --font-mono: "Roboto Mono", ui-monospace, monospace;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.04);
      --overlay-backdrop: rgba(0, 0, 0, 0.48);
      --login-hex-1: rgba(37, 99, 235, 0.11);
      --login-hex-2: rgba(34, 197, 94, 0.09);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #0f0f0f;
      --bg-card: #222222;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #ececec;
      --text-muted: rgba(236, 236, 236, 0.58);
      --accent: #4ade80;
      --accent-soft: rgba(74, 222, 128, 0.22);
      --secondary: #34d399;
      --secondary-soft: rgba(52, 211, 153, 0.2);
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.45);
      --overlay-backdrop: rgba(0, 0, 0, 0.65);
      --login-hex-1: rgba(74, 222, 128, 0.11);
      --login-hex-2: rgba(74, 222, 128, 0.06);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      background: var(--bg-page);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    button, input {
      font: inherit;
      color: inherit;
    }
    .login-page {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2.5rem;
      background-color: var(--bg-page);
    }
    /* Hexágonos grandes nos cantos (estilo do logo); parte do desenho fica fora da tela */
    .login-bg-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .login-bg-hex {
      position: absolute;
      width: min(110vmin, 720px);
      height: min(110vmin, 720px);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      -webkit-clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
    .login-bg-hex--tl {
      top: 0;
      left: 0;
      transform: translate(-42%, -48%) rotate(-8deg);
      background: var(--login-hex-1);
    }
    .login-bg-hex--tr {
      top: 0;
      right: 0;
      transform: translate(42%, -44%) rotate(14deg);
      background: var(--login-hex-2);
    }
    .login-bg-hex--br {
      bottom: 0;
      right: 0;
      transform: translate(46%, 48%) rotate(-11deg);
      background: var(--login-hex-1);
    }
    .login-bg-hex--bl {
      bottom: 0;
      left: 0;
      transform: translate(-46%, 44%) rotate(9deg);
      background: var(--login-hex-2);
    }
    .login-stack {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .login-hero-brand {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
    }
    .login-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 1.25rem 1.5rem 1.5rem;
    }
    .login-card-lead {
      margin: 0 0 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .input {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-page);
      margin-bottom: 0.85rem;
    }
    html[data-theme="dark"] .input { background: #2c2c2c; }
    .input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .btn-primary {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    html[data-theme="dark"] .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.8rem;
    }
    .login-links button {
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    html[data-theme="dark"] .login-links button { color: var(--accent); }
    .theme-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.75rem;
    }
    .theme-row button {
      font-size: 0.72rem;
      padding: 0.25rem 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-page);
      cursor: pointer;
      color: var(--text-muted);
    }
    .login-msg {
      font-size: 0.82rem;
      color: #b45309;
      margin-bottom: 0.75rem;
      min-height: 1.25em;
    }
    html[data-theme="dark"] .login-msg { color: #fbbf24; }
    .login-msg.err { color: #c2410c; }
    html[data-theme="dark"] .login-msg.err { color: #fca5a5; }

    .stub-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-backdrop);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .stub-overlay[hidden] { display: none !important; }
    .stub-sheet {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      max-width: 400px;
      width: 100%;
      padding: 1.25rem 1.25rem 1rem;
      box-shadow: var(--shadow-card);
    }
    .stub-sheet h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }
    .stub-sheet p {
      margin: 0 0 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .stub-sheet button {
      width: 100%;
      padding: 0.5rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-page);
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg-deco" aria-hidden="true">
      <span class="login-bg-hex login-bg-hex--tl"></span>
      <span class="login-bg-hex login-bg-hex--tr"></span>
      <span class="login-bg-hex login-bg-hex--br"></span>
      <span class="login-bg-hex login-bg-hex--bl"></span>
    </div>
    <div class="login-stack">
      <img
        class="login-hero-brand"
        src="/imagens/logo_empresarial_daily.png"
        alt="DAILY — Corporate Productivity Simplified"
        width="800"
        height="400"
        decoding="async"
      />
      <div class="login-card">
        <div class="theme-row">
          <button type="button" id="login-theme-toggle" aria-label="Alternar tema claro ou escuro">Claro / Escuro</button>
        </div>
        <p class="login-card-lead">Acesse com seu usuário e senha.</p>
        <p id="login-msg" class="login-msg" aria-live="polite"></p>
        <form id="form-login">
          <label class="field-label" for="login-user">Usuário</label>
          <input id="login-user" class="input" name="username" autocomplete="username" required />
          <label class="field-label" for="login-pass">Senha</label>
          <input id="login-pass" class="input" name="password" type="password" autocomplete="current-password" required />
          <button type="submit" class="btn-primary" id="login-submit">Entrar</button>
        </form>
        <div class="login-links">
          <button type="button" data-stub="forgot">Esqueci minha senha</button>
          <button type="button" data-stub="signup">Criar conta</button>
          <button type="button" data-stub="contact">Primeiro contato</button>
        </div>
      </div>
    </div>
  </div>

  <div id="stub-overlay" class="stub-overlay" hidden role="dialog" aria-modal="true">
    <div class="stub-sheet">
      <h2 id="stub-title"></h2>
      <p id="stub-body"></p>
      <button type="button" id="stub-close">Fechar</button>
    </div>
  </div>

  <script>
    (function () {
      var LS_THEME = "po_theme";
      function apiBase() {
        if (typeof location !== "undefined" && (location.protocol === "http:" || location.protocol === "https:")) {
          return location.origin.replace(/\/$/, "");
        }
        return "http://localhost:5000";
      }
      function applyTheme(dark) {
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
        else document.documentElement.removeAttribute("data-theme");
        try {
          localStorage.setItem(LS_THEME, dark ? "dark" : "light");
        } catch (e) {}
        var m = document.getElementById("meta-theme-color");
        if (m) m.setAttribute("content", dark ? "#0f0f0f" : "#fafafa");
      }
      document.getElementById("login-theme-toggle").addEventListener("click", function () {
        applyTheme(document.documentElement.getAttribute("data-theme") !== "dark");
      });

      var stubs = {
        forgot: {
          title: "Esqueci minha senha",
          body: "Esta instalação é de uso individual. Redefina a senha pelo menu de perfil (após entrar) ou peça ao administrador do servidor. Em ambiente de desenvolvimento você pode recriar o usuário executando o script de banco.",
        },
        signup: {
          title: "Criar conta",
          body: "Novos cadastros públicos estão desativados. Apenas o administrador pode criar usuários no banco de dados. Entre em contato se precisar de acesso.",
        },
        contact: {
          title: "Primeiro contato",
          body: "Para suporte ou onboarding, fale com o responsável pela instalação do DAILY. O usuário inicial é criado automaticamente pelo script criar_banco.",
        },
      };
      var ov = document.getElementById("stub-overlay");
      document.querySelectorAll("[data-stub]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var key = btn.getAttribute("data-stub");
          var s = stubs[key];
          if (!s) return;
          document.getElementById("stub-title").textContent = s.title;
          document.getElementById("stub-body").textContent = s.body;
          ov.hidden = false;
        });
      });
      document.getElementById("stub-close").addEventListener("click", function () {
        ov.hidden = true;
      });
      ov.addEventListener("click", function (e) {
        if (e.target === ov) ov.hidden = true;
      });

      var form = document.getElementById("form-login");
      var msg = document.getElementById("login-msg");
      var submit = document.getElementById("login-submit");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.textContent = "";
        msg.classList.remove("err");
        submit.disabled = true;
        var u = document.getElementById("login-user").value.trim();
        var p = document.getElementById("login-pass").value;
        fetch(apiBase() + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p }),
          credentials: "same-origin",
        })
          .then(function (r) {
            return r.text().then(function (t) {
              var body = {};
              try {
                body = t ? JSON.parse(t) : {};
              } catch (_) {}
              return { ok: r.ok, status: r.status, body: body };
            });
          })
          .then(function (res) {
            submit.disabled = false;
            if (res.ok && res.body && res.body.ok) {
              window.location.href = "/";
              return;
            }
            var err = (res.body && (res.body.erro || res.body.error)) || "Não foi possível entrar.";
            msg.textContent = err;
            msg.classList.add("err");
          })
          .catch(function () {
            submit.disabled = false;
            msg.textContent = "Sem conexão com o servidor.";
            msg.classList.add("err");
          });
      });
    })();
  </script>
</body>
</html>
